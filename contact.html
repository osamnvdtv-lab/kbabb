<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التواصل | ٢٣ يوليو نافع الكبير</title><style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap');*{box-sizing:border-box}body{margin:0;background:#10100e;color:#fff;font-family:Cairo,Tahoma,sans-serif}.bar{height:5px;background:#d8ad52}header{text-align:center;padding:20px;border-bottom:1px solid #49391d}a{color:#d8ad52;text-decoration:none}.wrap{max-width:650px;margin:35px auto;padding:20px}.panel{background:#1b1b18;border:1px solid #49391d;border-radius:16px;padding:25px}.panel h1{color:#e4bf6a}.panel p{color:#c7c0ad;line-height:1.9}label{display:block;margin:13px 0 6px}input,textarea,select{width:100%;padding:12px;border-radius:8px;border:1px solid #51452e;background:#10100e;color:#fff;font:inherit}.btn{display:block;width:100%;margin-top:17px;background:#d8ad52;color:#17130b;padding:12px;border:0;border-radius:8px;font:inherit;font-weight:900;cursor:pointer}footer{text-align:center;border-top:1px solid #49391d;padding:20px;color:#c7c0ad;font-size:13px}strong{color:#d8ad52}
</style></head><body><div class="bar"></div><header><a href="index.html">← العودة للرئيسية</a></header><main class="wrap"><section class="panel"><h1>تواصل مع المطعم</h1><p>املأ البيانات لكتابة رسالة طلب جاهزة. لم يتم إضافة رقم هاتف لأن الرقم لم يُذكر في البيانات المرسلة.</p><form id="orderForm"><label for="name">الاسم</label><input id="name" required placeholder="اكتب اسمك"><label for="type">نوع الطلب</label><select id="type"><option>استفسار عن المنيو</option><option>طلب وجبة</option><option>استفسار عن الأسعار</option><option>أخرى</option></select><label for="details">تفاصيل الرسالة</label><textarea id="details" rows="4" required placeholder="اكتب تفاصيل طلبك أو استفسارك"></textarea><button class="btn" type="submit">تجهيز رسالة الطلب</button></form><p id="result" aria-live="polite"></p></section></main><footer>إنتاج شركة <strong>ديلك ستار</strong></footer><script>document.getElementById('orderForm').addEventListener('submit',function(e){e.preventDefault();const msg='مطعم ٢٣ يوليو نافع الكبير\\nالاسم: '+document.getElementById('name').value+'\\nنوع الطلب: '+document.getElementById('type').value+'\\nالتفاصيل: '+document.getElementById('details').value;const url='https://wa.me/?text='+encodeURIComponent(msg);window.open(url,'_blank');document.getElementById('result').textContent='تم تجهيز الرسالة؛ اختر جهة اتصال المطعم في واتساب لإرسالها.';});</script></body></html>
